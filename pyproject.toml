[project]
name = "danmuweaver"
version = "0.1.0"
description = "将删减版视频的弹幕时间轴重新映射到完整版视频"
requires-python = ">=3.10"
dependencies = [
    "darkdetect>=0.8.0",
    "dtaidistance>=2.5.1",
    "numpy>=2.1.3",
    "opencv-python>=4.10.0.84",
    "pyside6>=6.8.0.2",
    "pyside6-addons>=6.8.0.2",
    "pyside6-essentials>=6.8.0.2",
    "pyside6-fluent-widgets>=1.7.1",
    "pysidesix-frameless-window>=0.4.3",
    "pywin32>=308 ; sys_platform == 'win32'",
    "scipy>=1.14.1",
    "shiboken6>=6.8.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
